<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3D Glow Card</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#0f172a;
  font-family:Arial, Helvetica, sans-serif;
}

.card{
  width:320px;
  height:420px;
  background:#111827;
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
  transition:transform 0.1s;
  box-shadow:0 0 20px rgba(0,255,255,0.3);
}

.card::before{
  content:"";
  position:absolute;
  width:320px;
  height:420px;
  border-radius:20px;
  background:linear-gradient(45deg,#00ffff,#ff00ff,#00ffff);
  filter:blur(30px);
  opacity:0.6;
  z-index:-1;
}

h1{
  font-size:28px;
}

p{
  color:#9ca3af;
}

button{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:10px;
  background:#06b6d4;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#0891b2;
}
</style>
</head>

<body>

<div class="card" id="card">
  <h1>🔥 Cool Card</h1>
  <p>Move your mouse around</p>
  <button onclick="alert('Hello Developer 😎')">Click Me</button>
</div>

<script>
const card = document.getElementById("card");

document.addEventListener("mousemove", (e) => {
  let x = (window.innerWidth / 2 - e.pageX) / 25;
  let y = (window.innerHeight / 2 - e.pageY) / 25;

  card.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
});
</script>

</body>
</html>
